<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title></title>
  </head>
  <body>
    <section id="timer-view" class="view">
      <main class="timer-shell">
        <div class="timer-content">
          <div id="activity-name" class="activity-name">Work</div>
          <div id="timer" class="timer-display" aria-live="polite" aria-atomic="true">
            <span id="timer-value">20</span>
            <span id="timer-unit">mins</span>
          </div>
        </div>

        <fluent-divider></fluent-divider>

        <div class="timer-actions" aria-label="Timer controls">
          <fluent-button id="reset" appearance="stealth" aria-label="Reset timer" title="Reset timer">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M4 10a6 6 0 0 1 10.47-4H12.5a.5.5 0 0 0 0 1h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-1 0v1.6a7 7 0 1 0 1.98 4.36.5.5 0 1 0-1 .08L16 10a6 6 0 0 1-12 0" />
            </svg>
          </fluent-button>
          <fluent-button id="prev" appearance="stealth" aria-label="Previous activity" title="Previous activity">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M3 3.5a.5.5 0 0 1 1 0v13a.5.5 0 0 1-1 0zm14 .75c0-1-1.12-1.6-1.95-1.04l-8.5 5.71c-.73.5-.73 1.57 0 2.07l8.5 5.8c.83.56 1.95-.03 1.95-1.04z" />
            </svg>
          </fluent-button>
          <fluent-button id="play" appearance="accent" aria-label="Start timer" title="Start timer">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M17.22 8.68a1.5 1.5 0 0 1 0 2.63l-10 5.5A1.5 1.5 0 0 1 5 15.5v-11A1.5 1.5 0 0 1 7.22 3.2z" />
            </svg>
          </fluent-button>
          <fluent-button id="pause" appearance="outline" aria-label="Pause timer" title="Pause timer">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M5 2a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm8 0a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z" />
            </svg>
          </fluent-button>
          <fluent-button id="resume" appearance="accent" aria-label="Resume timer" title="Resume timer">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M17.22 8.68a1.5 1.5 0 0 1 0 2.63l-10 5.5A1.5 1.5 0 0 1 5 15.5v-11A1.5 1.5 0 0 1 7.22 3.2z" />
            </svg>
          </fluent-button>
          <fluent-button id="next" appearance="stealth" aria-label="Next activity" title="Next activity">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M17 3.5a.5.5 0 0 0-1 0v13a.5.5 0 1 0 1 0zM3 4.25c0-1 1.12-1.6 1.95-1.04l8.5 5.71c.73.5.73 1.57 0 2.07l-8.5 5.8A1.25 1.25 0 0 1 3 15.75z" />
            </svg>
          </fluent-button>
          <fluent-button id="open-programs" appearance="stealth" aria-label="Programs" title="Programs">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M4.5 17A1.5 1.5 0 0 1 3 15.65V4.5c0-.78.6-1.42 1.36-1.5H9c.78 0 1.42.6 1.5 1.36v.4l2.19-2.27a1.5 1.5 0 0 1 2-.14l.12.1 2.76 2.72c.55.55.6 1.42.11 2.02l-.1.11-2.31 2.2h.23c.78 0 1.42.6 1.5 1.36v4.64c0 .78-.6 1.42-1.36 1.5H4.5m5-6.5H4v5c0 .22.14.4.33.47l.08.02.09.01h5zm6 0h-5V16h5a.5.5 0 0 0 .5-.4V11a.5.5 0 0 0-.41-.5zm-5-2.79V9.5h1.79zM9 4.01H4.5a.5.5 0 0 0-.5.4v5.1h5.5v-5a.5.5 0 0 0-.33-.48l-.08-.02zm5.12-.84a.5.5 0 0 0-.64-.05l-.07.06-2.62 2.71a.5.5 0 0 0-.05.63l.06.07 2.61 2.62c.17.17.43.2.62.07l.08-.06 2.76-2.63a.5.5 0 0 0 .05-.64l-.05-.06z" />
            </svg>
          </fluent-button>
        </div>

        <div class="activity-bar" aria-hidden="true"></div>
      </main>
    </section>

    <section id="programs-view" class="view programs-view" hidden>
      <header class="programs-header">
        <fluent-button id="close-programs" appearance="stealth" aria-label="Back to timer" title="Back to timer">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M9.16 16.87a.5.5 0 1 0 .67-.74L3.67 10.5H17.5a.5.5 0 0 0 0-1H3.67l6.16-5.63a.5.5 0 0 0-.67-.74L2.24 9.44a.75.75 0 0 0 0 1.11z" />
          </svg>
        </fluent-button>
        <h1>Programs</h1>
        <fluent-button id="upload-program" appearance="accent">
          <svg slot="start" viewBox="0 0 20 20" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M15 3a.5.5 0 0 0 .09-.99H4a.5.5 0 0 0-.09.98L4 3zM9.5 18a.5.5 0 0 0 .5-.41V5.7l3.64 3.65c.17.18.44.2.64.06l.07-.06a.5.5 0 0 0 .06-.63l-.06-.07-4.5-4.5A.5.5 0 0 0 9.6 4h-.1a.5.5 0 0 0-.4.19L4.64 8.65a.5.5 0 0 0 .64.76l.07-.06L9 5.71V17.5c0 .28.22.5.5.5" />
          </svg>
          Import
        </fluent-button>
        <input id="program-file" type="file" accept=".yaml,.yml,application/yaml,text/yaml" hidden />
      </header>

      <p id="program-message" class="program-message" role="status" hidden></p>
      <div id="program-list" class="program-list" role="list" aria-label="Timer programs"></div>

      <fluent-dialog id="delete-dialog" aria-labelledby="delete-dialog-title" hidden>
        <div class="delete-dialog-content">
          <h2 id="delete-dialog-title">Delete program?</h2>
          <p id="delete-dialog-description"></p>
          <div class="dialog-actions">
            <fluent-button id="cancel-delete" appearance="outline">Cancel</fluent-button>
            <fluent-button id="confirm-delete" appearance="accent">Delete</fluent-button>
          </div>
        </div>
      </fluent-dialog>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
